[client]
toolbarMode = "minimal"

[server]
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#1e3a8a"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#eef2f7"
textColor = "#1c2b4a"
linkColor = "#1e3a8a"
borderColor = "#e2e8f0"
baseRadius = "0.625rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#e7edf5"
